    nearest: "物理侧：Kim & Hollerbach PRE 2017（information length L = ∫dt/τ 的定义）；Tenkès, Hollerbach, Kim 2017（以 L 为单位看 logistic 与 Gompertz 更相似——本格命题的雏形）；Kim & Hollerbach 2017 相变 / Guel-Cortez & Kim 2021 突变预测；Sumaya-Martinez 2026 Fisher-Informational Time（概念上 A 级重合：时钟时间 = 累积 Fisher 距离，但纯物理无数据，必须引）；根源 Wootters 1981、Crooks 2007、Ito 2018、Nicholson et al. Nat. Phys. 2020。ML 侧：Mao et al. PNAS 2024（训练轨迹按 Fisher–Rao geodesic 进度重索引）；Zakharov 2020（surprise 门控的主观时间尺度世界模型，是本格的阈值离散版）；TOTR（Standridge 2026，欧氏弧长时间重参数化让 neural ODE 的 loss 降 1–2 个数量级——必须当对照）。"
