rules:
  status: "v0.5 提议（handoff 作者，2026-11-04），从第一周结果归纳。R4 已随 Z 的预先授权生效；其余请 Claude Code 复核，可以反驳，反驳理由写进这里"
  R1_admissible_criteria: >
    判据只允许三类：(a) 从学到的或带噪的模型里恢复真值；(b) 对潜空间重参数化不变（按 R3 的完整含义）；(c) 相对同源非几何量（R2）的增量。
    在精确状态上跑的 kill test 只检验定理，不算判据，只能用来校准仪器（格 3、7 与第二轮格 22 的教训）。
  R2_same_source_control: >
    每格写 same_source：与几何读数出自同一信息源、最笨的非几何量，并把它当主对照；写不出就不入表。
    第一周的五个例子：格 1 压缩带 ⇔ 数据密度（Liouville）；格 3 WFR 份额 ⇔ ∂tρ 的谱（份额 = k²δ²/(1+k²δ²)）；
    格 6 和乐 ⇔ HCDP 指纹；格 9 Fisher 弧长 ⇔ 白化欧氏弧长；格 8 不对称场 ⇔ 熵产生（NEEP / LENS，涨落定理）。
  R3_invariance_and_predictive_law: >
    精确版：若一个读数在所有给出同一观测层预测分布的模型上都取同一个值（这正是"规范不变 / 对潜空间重参数化稳健"的完整含义），
    它就是预测分布 p(o_{t+1:} | o_{≤t}, a) 的泛函，同一个分布原则上不经几何也能直接估。
    所以 diagnose 格只能主张"更好的统计量"（更省数据、更稳、更可解释），不能主张"看到了更多信息"；几何当约束用的格（predict / plan）靠消融证明自己。
    注意：只对潜空间微分同胚不变的读数（潜空间拓扑、维数等）可以不是预测分布的泛函，但它描述的是"模型怎样实现规律"，不是世界；格 0 属于这一类。
    HANDOFF §7 的交付形式相应改为：可测不变量 + 解析真值 benchmark + 归因消融 + 同源对照。
  R4_reviewer_ground_truth_only: >
    审稿 agent 只核对真值（解析解、模拟器、单元测试、计分脚本在已知答案上的输出），不训练模型。
    这也是 Z 预先授权的三个前提之一（见 decisions）。
  R5_calibrate_observation_first: >
    先标定观测伪迹，再读几何：在保守世界、等变渲染、冻结 σ 的白化基线上，读数必须约为 0 或给出标定值，之后只报告相对标定值的超额。
    观测几何会冒充动力学几何（格 1 的解码器拉回、格 15 的射影相机）。

  code_review:
    date: 2026-11-12 JST
    by: Claude Code（仓库里做第一周工作的那个）
    summary: >
      R4 照原样接受；R1、R2、R3、R5 和 symmetrize 都接受方向，各提一处修正（见下）。都不是阻塞意见，所以 PR #1 照合并，
      这里的修正和原提议一样仍是"提议"，等 handoff 作者或 Z 有异议再改。0–15 格的 same_source：8 格接受，5 格改写，3 格补充；改写前的原提议保留在下面。
    R1: >
      两处修正。(1) 精确状态上的检验能杀、不能救：格 3 的 WFR 读数、格 7 的连续 α-计都是在精确状态上被杀的，
      "只能用来校准仪器"会把这类合法的杀排除掉。改为：精确状态上的结果不能让一格活，但可以让它死。
      (2) (a)(b) 是资格条件，不是主张。凡是主张"几何多给了东西"，主判据必须含 (c)；只有关于模型本身的格（R3 第二层，例如格 0）可以只用 (a)(b)。
      否则一个同源笨量同样能恢复真值时，(a) 也会被记成胜利。
    R2: >
      三处修正。(1) 对照取同一信息源里最强的廉价非几何量，不是最笨的：最笨的容易变成稻草人（格 6 用 HCDP 指纹正是取最强的）。
      (2) "同源"要可操作：对照只能用几何读数用到的同一批样本、同一组模型查询，不能多拿信息，也不能少拿。
      (3) "写不出就不入表"改为"写不出就停在思想实验阶段，不进算力杀"：存档是 MAP-Elites，删掉会丢覆盖；status 保持 unexplored 并注明缺 same_source。
    R3: >
      第一层（预测分布的泛函）在定义上就成立，接受。修正一处："同一个分布原则上不经几何也能直接估"只在数据支撑上成立。
      在数据没覆盖的动作序列和状态上（反事实 rollout、格 6 的随机探针），预测分布是模型的外推，没有模型就估不出来；
      几何在那里能通过归纳偏置起作用，这正是约束格的地盘。对 diagnose 格的后果：读数若用到离开支撑的查询，读到的是模型的外推，
      要在模拟器真值上核对这些查询（R4 审稿可以做）。"更好的统计量"要预注册具体指标（固定 N 下的数据效率、方差），格 6 v1 的 250 / 500 / 2000 episode 就是例子。
    R4: >
      接受。补两条执行细节：审稿 agent 不读 runs/ 下任何训练产物；预注册里的 pilot 只记计时和 gate 指标，计分脚本在 pilot 模式下拒绝计算主读数（写进代码，不靠自觉）。
    R5: >
      接受，补一处："报告超额"假设伪迹和信号可加。格 15 的审稿发现学到的解码器会把相机项放大 10–20%，并不可加。
      所以要在至少两个伪迹强度上标定，检查可加性；伪迹在已知对称下为奇时，优先用 symmetrize 抵消而不是相减。
    symmetrize: >
      接受。补一处：它只消掉在该对称下为奇的分量，为偶的伪迹（例如学到的解码器自己的误差项，宇称未知）仍要靠 R5 标定。两者互补，不能互相替代。
    same_source:
      v05_proposals_replaced:
        0: "冻结的低容量线性探针（cos θ、sin θ、能量 E 的 R²）。持续同调要给出探针给不出的东西（切口 / 粘合 / 绕数），否则只是探针的换算"
        5: "数据协方差的 PCA 谱（第一轮审计的 conditional 已要求与之区分）"
        9: "冻结 σ 的白化欧氏弧长；再加墙钟"
        10: "块平均粗粒化 + 关联长度 / 跨尺度互信息衰减"
        15: "数据密度 / 平稳密度图与位移亏损（与格 1 同源）；轨道平均部分就是 Lyapunov 谱之和（Wang / LeHami 已用）"
      reasons:
        0: 线性探针太弱：能量的线性 R² 在真值图上只有 0.15，cos θ、sin θ 的线性探针对任何非线性嵌入的圆都会失败。拓扑读数的同源局部量是接缝比，它已是预注册里的共同主读数，所以 PH × SR 一致性表就是本格的 R2 对照
        2: 补"坐标"：欧氏 HHD 在频率坐标和 clr 坐标下结果不同，只做一种等于偷偷选了一个度量
        4: 补 v0.4 must 里的"拓扑 vs 流形约束"归因对照
        5: Fisher = JᵀΣ⁻¹J，与它同源的是同一个 Jacobian 去掉噪声权重；数据 PCA 是另一个对象，留作第二对照
        9: 第二轮文献已把对照扩成四元（加惊奇时钟），它和 Fisher 时钟用同一个后验
        10: Tao et al. 是最近邻，出处已核实（见 cells[10].notes 的 v0.5 复核），应作直接基线
        12: 补 Liang 2026（v0.4 must 已要求打平）
        15: 观测坐标里的密度满足 d log ρ_obs/dt = −div_obs f，带着同一个相机 Jacobian；不对称化的密度图会被同一个伪迹骗，用它当对照是稻草人
    cells_2_and_7: 同意算一格（Wright–Fisher 上的度量归因，格 7 的工具作副读数）。格 7 的 status 改不改，等 Z 确认格 1、3、7、8 的状态变更时一起定，这里不动
    round_2_self_review: >
      没有逐格复核，只核了三格死因：16（就是格 1 的 Cauchy–Green 对象）、28（边缘分布在平稳态下 p_t = p_{t+1}，统计量恒为 0；路径版 KL 就是 NEEP，即格 8）、
      30（dip test）都成立。其余等 rules 定稿后做文献杀时一起审。
    citations: >
      两条都核实了。LeHami = arXiv 2610.15267v1（2026-10-11）；全文 §3.2 / 图 4 右用 (1/n)Σ log|det J(z_i)| 跟踪 rollout 的相体积，
      LeWM 基线在保守与受驱的视觉单摆上持续收缩，LeHami 恒为 0；附录 C.4 原文 "Because both systems studied in this work preserve volume,
      we leave dissipative modeling to future work"，局限一节提 port-Hamiltonian 扩展。第二轮文献的原始记录（results/lit_round2_raw.json）里这条标的是"HTML 全文已核"，不是检索摘要。
      Tao–Tao–You–Zhang：Crossref 给出 Physica D: Nonlinear Phenomena 472, 134505（2025-02），DOI 10.1016/j.physd.2024.134505。

