      引 Sumaya-Martinez 2026（标题以 arXiv 页面为准）与 Tenkès 2017。
      information length 的提出者应写 Nicholson & Kim 2015 / Kim et al. 2016。
      TOTR 的引用改写为"时间映射的正则性决定可学性"：它没有和墙钟比，也没有和 Fisher 比，HANDOFF §7 的"欧氏弧长就能带来大部分增益"是过度解读。
