# cells.yaml — 几何世界模型生成器的活状态
# 版本 0.4 · 2026-11-03（第二轮文献审计五路 + 第一批思想实验并入；原文件标注的 0.3 日期为 2026-11-04，与系统日期不符，以实际日期为准）
# 由 Claude Code 维护；每次 kill test 后更新 status / confidence / notes，并写明理由。v0.4 的每处改动都在对应格的 notes 里以 "v0.4（2026-11-03）" 开头说明。
#
# 字段说明
#   structure   几何结构（原语 A）        slot        放在世界模型的哪个部位（原语 B）
#   source      几何从哪来                 readout     不变量用来干什么（diagnose / predict / plan / explain）
#   learn/fix   学什么 / 固定什么
#   prediction  一句可以错的话（预注册的骨架）
#   kill_test   最便宜的处决办法（世界、对照、判据）
#   cost_days   算力 + 人力的时间盒估计
#   confidence  exists（成立）/ novel（新颖）/ yields（出结果）∈ {low, lowmid, mid, midhigh, high}；novel 已按审计更新
#   status      unexplored | lit_killed | thought_killed | alive | dead | merged_into:<id>
#   neighbors   结果会相互更新先验的格子
#   exits       幸存后的外部 benchmark 候选
#   collision   审计撞车等级 A（直接撞车）/ B（近邻）/ C（远邻），带 +/−；pending = 审计未完成
#   nearest     最近邻工作（短；全文见 literature_audit.md）
#   must        审计后"要活下来必须做到"的条件
#
# 评分（选下一个凿哪格）：score = P(alive) * V(alive) / cost_days + centrality(neighbors 数)
# 审计后的大原则（五路报告共同指向）：物理/几何结构放进世界模型后，(1) 收益归因要专门消融（Gruver 2022：HNN 收益不来自辛结构），
# (2) 不变量必须对潜空间重参数化稳健（GENERIC-FNO 的 gauge 警示），(3) 等变/结构只保证误差平坦不保证误差小（Wang 2026）。
# 所以每格的交付形式统一为：可测不变量 + 解析真值 benchmark + 归因消融。

schema_version: 0.4

naming_note: >
  "Geometric World Models" 已被 GeoWorld（Zhang, Li, Reid, Hartley, CVPR 2026, 双曲 JEPA）占用，
  且 2025–26 的 "geometric world model" 多指 3D 一致的视频世界模型（Aether, Geometry Forcing 等）。
  "information-geometric world models" 与 "invariant-structured world models" 目前零命中，可用。
  v0.4（2026-11-03 复查）：两者仍零精确命中；Zenodo 上一篇未经同行评议的 GDL-for-world-models 评论又占用一次 "geometric world models"。

axes:
  structures: [metric, connection, symplectic_contact, topology, singularity, klein_hierarchy, discrete_curvature, order_dually_flat, scale]
  slots: [state_space, distribution_over_states, theory_space, action_space, observation_map, time_axis, scale_axis]
  sources: [intrinsic, pullback_from_observation, pullback_from_cost, from_distinguishability]
  readouts: [diagnose, predict, plan, explain]
  operators: [dualize, pullback, couple, contrast, flow_along_parameter]

worlds:
  pendulum:        {truth: "S^1 x R; symplectic; energy conserved; div = 0", obs: [angle, pixels64]}
  double_pendulum: {truth: "T^2 x R^2; chaotic; energy conserved", obs: [angles, pixels64], held_out: true}
  toggle_grid:     {truth: "hidden door state; non-commuting actions; holonomy around switch loops", obs: [grid]}
  wright_fisher:   {truth: "selection = e-geodesic, migration = m-geodesic; RPS variant is rotational", obs: [frequencies]}
  gray_scott:      {truth: "pointwise rule with translating gliders; attractor topology; natural coarse-graining", obs: [field]}
  lenia:           {truth: "same as gray_scott, richer creatures; standard Lenia = additive local source with clipping, no flux (v0.4: was mislabelled 'pure pointwise reweighting'; it can create mass where A=0, which Fisher–Rao reweighting cannot)", obs: [field]}
  flow_lenia:      {truth: "same growth field as Lenia but mass-conserving pure transport (Plantec et al. 2025) — ground-truth 'transport' extreme for cell 3", obs: [field]}
  ising:           {truth: "known RG flow direction and fixed point — calibration world for cell 10", obs: [spins]}
  kuramoto:        {truth: "torus; sync transition at known K_c", obs: [phases], held_out: true}
  damped_pendulum: {truth: "div = -2*gamma (uniform); asymmetric cost", obs: [angle]}
  friction_patch:  {truth: "divergence localized to patch", obs: [state]}
  lorenz:          {truth: "constant div = -(sigma+1+b)", obs: [state]}
  van_der_pol:     {truth: "state-dependent div = mu(1-x^2)", obs: [state]}
  mechanism_pair:  {truth: "known causal direction; independent mechanisms", obs: [x, y]}
  camera_ladder:   {truth: "same scene under Euclidean / affine / projective / homeomorphic observation maps", obs: [pixels64]}

cells:

  - id: 0
    name: 公共前提：潜空间能否承载几何结构
    structure: none
    slot: state_space
    source: intrinsic
    readout: diagnose
    learn: MLP 世界模型（对照组本身）
    fix: 无
    invariant: 潜空间的 H1 持续同调，且显著类必须绕柱面一圈（winding = ±1，由圆坐标或环绕数判定；只摆动的能量环也给 b1 = 1，但它在柱面里可缩）；能量是否可被平滑解码
    prediction: （v0.3 原版，照常打分）中等尺寸下 H1 出现但跨种子不稳定；能量可解码但不平滑。v0.4 主预测见 cells/0/prereg.md：潜空间拓扑由训练目标的几何决定，而不是由数据决定。
    kill_test: 见 cells/0/prereg.md（草案，待 Z 批准）：观测（angle_cs / angle_raw / pixels64）× 目标（recon-mse / recon-circular / jepa）× 4 尺寸 × 3 种子，外加只摆动的负对照数据。
    cost_days: 2
    confidence: {exists: high, novel: low, yields: high}
    status: unexplored
    neighbors: [1, 4, 9, 15, 5]
    exits: []
    collision: n/a
    nearest: "Batson et al. 2021 JHEP（作者 Batson, Haaf, Kahn, Roberts）；Kvalheim & Sontag 2025（障碍只在 ℓ = m 的闭流形上出现，且只体现在最坏误差）；Ivashkov, Balestriero, Schölkopf 2026（Reacher 上的环面只是 PCA 目测；SIGReg 基线的角度探针 R² 0.999，高于 SMWM 的 0.946）；DySIB 2026（R² 环形也是目测，并且是十个种子里挑最好的）；Bao 2026（DreamerV3 单摆模型中跨种子一致的类能量不变量，含投影干预）；Liao & Cao 2026（能量线性可解码但对预测没有因果作用）；Internò 2026（高容量探针会污染测量）；Nicollier 2026（JEPA 正则器的几何是拓扑先验）；Tan 2026（预测时程决定编码哪些物理量）"
    must: >
      判据定量化（已在 cells/0/calibration.md 校准）。
      H1 必须判"绕柱面"，不只是 b1。
      真值 H1 由数据的能量范围决定，所以要同时有含转动的数据和只摆动的负对照。
      能量分三级判：冻结的低容量线性探针 → 解码后物理能量在 rollout 中的漂移 → 可选的 donor-swap 因果干预。
      把目标函数当因子（recon / jepa），正则器类型与预测时程 K 作为副因子。
      写明二维及以上的欧氏潜空间本来就能无切口地承载 S¹×R，所以单摆上出现 H1 不说明需要几何约束。
      两个问题目前零命中，是本格的新部分：WM 潜空间持续同调的定量跨种子测量；原始 wrapped 角度在无 decoder 训练下是否被粘合。
    notes: >
      v0.3：不是一个想法，是所有想法的地基。首凿。
      v0.4（2026-11-03）：
      (1) 思想实验：重建当前帧的 WM，其 b1 ≥ 1 几乎由单射性保证，所以有信息量的条件是 angle_raw 和 jepa。
      (2) zoo agent：只摆动的能量环给出 b1 = 1，但这个圈可缩，判据必须加 winding。
      (3) 第二轮文献：前提已被部分测过，但都只是目测，没有持续同调定量、没有跨种子统计、没有 decoder vs decoder-free 对照，也没有粘合测试。
      (4) 对抗审稿 + 审稿人 pilot（非盲，已披露）：潜空间主要继承输入编码的切口。stop-grad 与对称 JEPA 的差别比"有没有解码器"更关键。
      (5) 预注册审稿（2026-11-04）：修订后再批。挡住批准的有四点：计分分叉；接缝比在跨切口窗口和 κ < 10 下偏向"粘合"，需要改仪器并重新校准；gate 排除了能证伪 P0.5 的折叠结局；决策表不完整。
          v2 修订清单见 cells/0/prereg.md。

  - id: 1
    name: 曲率即规律（测地线世界模型）
    structure: metric
    slot: state_space
    source: pullback_from_observation   # v0.4：改为预测分布的 Fisher 拉回（k 步 Cauchy–Green），见 notes
    readout: predict
    learn: encoder / decoder 与动作偏离项；度量 = 预测分布 p(o_{t+k}|z,a) 的 Fisher 拉回 C_k = Σ_{j≤k} J_{F^j}ᵀ g_obs J_{F^j}（v0.3 为观测模型 p(o|z) 的 Fisher 拉回，已被思想实验否定）
    fix: 自由演化 = 测地线方程；度量来源固定
    invariant: v0.4：FTLE / LCS 场与 log det C_k，即"Cauchy–Green 图 = 障碍图"。log det C_k 沿轨迹等于 2∫div f dt 加端点体积项，与格 15 同源。C_k 是观测度量的拉回，对潜空间重参数化不变
    prediction: （v0.4）带墙世界里，学到的动作条件 WM 的 C_k / FTLE 脊与真实墙布局对齐（IoU 显著高于零分布），并与模拟器真值 FTLE 一致；固定 σ 解码器拉回对墙平坦（阴性对照）；Temporal Straightening 训练前后障碍图一致（不变性预测，可证伪）。
    kill_test: 带墙网格 / 点迷宫（含隐形墙版本）；四个对照：(a) 固定 σ 解码器拉回；(b) 数据密度 / 支撑图（排除"墙内无数据"的混杂）；(c) 模拟器真值 FTLE；(d) Temporal Straightening（ICML 2026）前后对比。学到的 C_k 图与障碍无关，或者不优于支撑图 → 死。
    cost_days: 3
    confidence: {exists: mid, novel: lowmid, yields: low}
    status: thought_killed
    neighbors: [6, 15, 4, 9]
    exits: [physics_discovery_datasets, worldbench_param_estimation]
    collision: "B+（原测地线命题）/ B−（v0.4 Cauchy–Green 改写版）"
    nearest: "Friedl et al. ICLR 2025 + 2026 续作（潜空间学 SPD 度量 + Euler–Lagrange + 外力，机器几乎同构）；Beik-Mohammadi/Klein/Xu（障碍=度量、运动=测地线，机器人运动生成）；Wang et al. 2026 Temporal Straightening（JEPA 里反向压平曲率）；Koide & van de Venn 2026（同一恢复力可归为曲率或非度量性 → 仅凭轨迹曲率与力不可辨识）；GeoWorld CVPR 2026 占名"
    must: >
      v0.4：度量钉在预测分布的 Fisher 拉回（Cauchy–Green）上，而不是观测模型 p(o|z) 的拉回。
      对照必须包括：固定 σ 解码器拉回、数据支撑图、模拟器真值 FTLE。
      学到的平滑模型会抹平接触处的不连续（Suh et al. ICML 2022 的类比警示），FTLE 脊的位置要对照真值校准。
      在 LeWM 类强基线上比较（Nguyen 2026）；改名；主命题改成诊断量。
      考虑与格 15、格 12 合并为"Cauchy–Green 世界模型诊断"。
    notes: >
      v0.3：技术撞车最重；只有满足 must 才值得投入。合并候选 1+6（带挠率）。
      v0.4（2026-11-03）：
      (1) 思想实验：固定 σ 高斯解码器的 Fisher 拉回就是 J_μᵀJ_μ/σ²，只描述观测映射。隐形墙让它平坦，看得见的墙则因遮挡伪迹造出"曲率"，所以 v0.3 的 must 解决了可辨识性，但量错了对象。
      (2) 第二轮文献 R5 补充：方差感知的解码器拉回会因墙内无数据让墙"发亮"，这是数据支撑造成的混杂。
      (3) 改写版（预测 Fisher / Cauchy–Green / FTLE，在学到的动作条件 WM 上）零命中；FTLE 只在 neural ODE 分类器（Wöhrer & Kuehn 2026）、flow-map 代理和储备池上算过。原测地线命题仍为 B+，改写版约为 B−。
      引用更正：Temporal Straightening 已是 ICML 2026，7 位作者，LeCun 第 6、末位是 Mengye Ren，HANDOFF 里的"LeCun 组"偏松。Friedl ICLR 2025 与 2026 续作的细节全部属实，两篇都不分析学到度量的曲率。
      (4) 对抗审稿（2026-11-03，脚本在 cells/1/exploratory/）推翻了 v0.4 的修正方案，被推翻的是"曲率图 = 障碍图"在两种度量下的版本。
          体积守恒的接触（弹性反射、reject）下，J 几乎处处正交或为单位阵，C_k 在墙面上等于自由空间的值，看不见墙；toggle_grid 用的就是 reject。
          耗散接触（滑动、停止、非弹性）下，C_k 只给出单侧压缩带，不是峰；平直墙面上 C_k 的曲率恒为 0。
          非几何的位移亏损图（IoU 0.91–0.98）和数据密度图（Liouville：压缩 ⟹ 堆积）都能点亮同一条带。
          不变量 log det(g_obs⁻¹C_k) = 2∫div_ν f，与格 15 同源，也继承了相机依赖。
          结论：status → thought_killed。
          剩下的窄缝不足以支撑"曲率即规律"：薄墙 + reject 规则，或弯曲弹性障碍，并且要同时打败位移亏损与密度两个基线。
          "测地线世界模型"作为预测架构仍是 Friedl 等的地盘（B+）。

  - id: 2
    name: 下降即规律（自然梯度流世界模型）
    structure: metric
    slot: distribution_over_states
    source: intrinsic
    readout: diagnose
    learn: 统计流形上的标量势 F（必须限为标量势：若适应度可以任意依赖频率，任何内部动力学都是 replicator，natural deviation 恒可为 0）；训练损失可取 Raab, de Alfaro, Liu 的 natural deviation
    fix: Fisher 度量；动力学 = −G⁻¹∇F（+ 动作作为外加驱动）
    invariant: Fisher 度量下 Hodge 分解的残差。标量势约束下 natural deviation 的最优值 = L²(μ, Fisher) 中投影到梯度场后的残差，所以"旋度比"与"natural deviation"是同一个量；需预注册状态测度 μ 与分解口径（Hodge / Wang HJ / natural deviation）
    prediction: （v0.4 度量归因版）在同一批轨迹上：一般对称收益的 replicator 世界里，欧氏 HHD 报出假旋度、Fisher 版 ≈ 0；循环突变世界里，Fisher 旋度随突变率 μ 线性增长；从有噪、有限 N 的数据学到的 F 仍保持这两点。（v0.3 原预测"带突变的 replicator 落在两者之间"对均匀突变是错的，见 notes。）
    kill_test: wright_fisher（一般对称收益 / 循环突变梯子 / RPS + 突变）；从轨迹拟合 F（MPL 为基线）；Fisher-Hodge 与欧氏 HHD head-to-head。欧氏版同样好 → 死。原"三世界"测试降为估计器校准，因为它测的是定理。
    cost_days: 1
    confidence: {exists: high, novel: low, yields: mid}
    status: unexplored
    neighbors: [7, 5, 6]
    exits: [physics_discovery_datasets]
    collision: "A-（命题层）/ B+（方法层）"
    nearest: "Legacci, Mertikopoulos, Pradelski ICML 2024（Shahshahani 度量下博弈动力学的势 / 调和分解与回归性；replicator 世界上的三条预测因此已是定理）；Zhang…Wang JCP 2012（演化 = 适应度梯度 + curl 通量）与 Jin Wang 2015 landscape–flux 综述（全文未核）；Sohail…Barton MPL, Nat. Biotech. 2021（WF 协方差加权的线性 F 闭式，即 natural deviation 在线性 F 时的特例）；Raab, de Alfaro, Liu 2022/23 Conjugate Natural Selection（作者顺序已更正；natural deviation 定义在正文 Def. 8）；Friston 2019 FEP f=(Q−Γ)∇ℑ；JKOnet 系列与 Wasserstein Residuals（Heinonen et al., NeurIPS 2026）；HHD-GP NeurIPS 2024；ddHodge Nat. Commun. 16:11342 (2025)；Velde（仅 arXiv 预印本，没有 Nat. Commun. 记录）；Fujiwara 1993"
    must: 以可估计量立身（学到的 F + Hodge 残差）。定位为"Wasserstein Residuals 的 Fisher–Rao 对应物"，写成"FEP / landscape-flux 假设的分解，我们从数据估计并检验"。kill test 必须是 Fisher vs 欧氏的度量归因；以 MPL 为基线，新意放在非线性 F、部分可观测和有限 N；突变用循环突变（均匀突变是 Shahshahani 梯度）；预注册 μ 与分解口径
    notes: >
      v0.3：叙事撞车重、技术空位清楚："Fisher 版 JKOnet"没人做。
      v0.4（2026-11-03）：
      (1) 第二轮文献把命题层升到 A−（Legacci 2024、Wang 2012），方法层仍为 B+。
      (2) zoo agent 与第二轮文献 R3 各自独立推导并数值核对：迁移 μ(m−x) 与均匀突变都是 Shahshahani 精确梯度流，势为 −μ·KL(m‖x)。所以原预测"带突变的 replicator 落在两者之间"对均匀突变是错的，而且 Hodge 分不开选择与迁移。
      (3) 格 7 被思想实验杀之后留下的二分 e/m 检验加 r_min，并入本格作工具，正好补上 Hodge 看不见的"选择 vs 迁移"区分。
      (4) 本格与格 6 之间有一座桥：landscape-flux 中"通量 = 规范场曲率"（Wang 2015，全文未核）。
      合并候选 2+5。

  - id: 3
    name: 搬运还是改权（Wasserstein–Fisher–Rao 世界模型）
    structure: metric
    slot: distribution_over_states
    source: intrinsic
    readout: diagnose
    learn: 速度场 v 与生长率 r：∂ₜp = −∇·(pv) + pr；比值做成 δ-谱 ratio(δ)（δ 从 0 = 纯 Fisher–Rao 扫到 ∞ = 纯 Wasserstein）
    fix: WFR 最小作用量决定 v/r 的分配（UPFI 证明不加 WFR 能量正则时 (v, r) 不可辨识，所以比值是"给定 δ 后的最小作用量选择"，不是过程的内在量——这正是把它做成 δ-谱的理由）
    invariant: 每个过程的搬运/改权比随 δ 的曲线；Flow-Lenia（纯搬运实现）与标准 Lenia（纯改权实现）是同一 growth 场的两个有真值的极端
    prediction: 同一 growth 场下，WFR 分解对 Flow-Lenia 给搬运占比 ≈ 1，对标准 Lenia 的 glider 给中间值，对静止振子给 ≈ 0；δ-谱曲线形状区分平移 / 生长 / 死亡 / 分裂四类过程，跨种子 CV < 20%。
    kill_test: 相邻帧之间算 WFR 测地线（Chizat 缩放算法或 WFR-FM）扫 δ；Lenia vs Flow-Lenia 同场对照；glider vs 振子。Flow-Lenia 不给 ≈1、或 δ-谱分不开四类过程 → 死。
    cost_days: 2
    confidence: {exists: high, novel: low, yields: low}
    status: thought_killed
    neighbors: [7, 10, 9]
    exits: [single_cell_trajectory_inference]
    collision: A/B
