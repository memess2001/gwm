# cells.yaml — 几何世界模型生成器的活状态
# 版本 0.3 · 2026-11-04（第一轮文献审计五路全部并入）· 由 Claude Code 维护；每次 kill test 后更新 status / confidence / notes，并写明理由。
#
# 字段说明
#   structure   几何结构（原语 A）        slot        放在世界模型的哪个部位（原语 B）
#   source      几何从哪来                 readout     不变量用来干什么（diagnose / predict / plan / explain）
#   learn/fix   学什么 / 固定什么
#   prediction  一句可以错的话（预注册的骨架）
#   kill_test   最便宜的处决办法（世界、对照、判据）
#   cost_days   算力 + 人力的时间盒估计
#   confidence  exists（成立）/ novel（新颖）/ yields（出结果）∈ {low, lowmid, mid, midhigh, high}；novel 已按审计更新
#   status      unexplored | lit_killed | thought_killed | alive | dead | merged_into:<id>
#   neighbors   结果会相互更新先验的格子
#   exits       幸存后的外部 benchmark 候选
#   collision   审计撞车等级 A（直接撞车）/ B（近邻）/ C（远邻），带 +/−；pending = 审计未完成
#   nearest     最近邻工作（短；全文见 literature_audit.md）
#   must        审计后"要活下来必须做到"的条件
#
# 评分（选下一个凿哪格）：score = P(alive) * V(alive) / cost_days + centrality(neighbors 数)
# 审计后的大原则（五路报告共同指向）：物理/几何结构放进世界模型后，(1) 收益归因要专门消融（Gruver 2022：HNN 收益不来自辛结构），
# (2) 不变量必须对潜空间重参数化稳健（GENERIC-FNO 的 gauge 警示），(3) 等变/结构只保证误差平坦不保证误差小（Wang 2026）。
# 所以每格的交付形式统一为：可测不变量 + 解析真值 benchmark + 归因消融。

schema_version: 0.3

naming_note: >
  "Geometric World Models" 已被 GeoWorld（Zhang, Li, Reid, Hartley, CVPR 2026, 双曲 JEPA）占用，
  且 2025–26 的 "geometric world model" 多指 3D 一致的视频世界模型（Aether, Geometry Forcing 等）。
  "information-geometric world models" 与 "invariant-structured world models" 目前零命中，可用。

axes:
  structures: [metric, connection, symplectic_contact, topology, singularity, klein_hierarchy, discrete_curvature, order_dually_flat, scale]
  slots: [state_space, distribution_over_states, theory_space, action_space, observation_map, time_axis, scale_axis]
  sources: [intrinsic, pullback_from_observation, pullback_from_cost, from_distinguishability]
  readouts: [diagnose, predict, plan, explain]
  operators: [dualize, pullback, couple, contrast, flow_along_parameter]

worlds:
  pendulum:        {truth: "S^1 x R; symplectic; energy conserved; div = 0", obs: [angle, pixels64]}
  double_pendulum: {truth: "T^2 x R^2; chaotic; energy conserved", obs: [angles, pixels64], held_out: true}
  toggle_grid:     {truth: "hidden door state; non-commuting actions; holonomy around switch loops", obs: [grid]}
  wright_fisher:   {truth: "selection = e-geodesic, migration = m-geodesic; RPS variant is rotational", obs: [frequencies]}
  gray_scott:      {truth: "pointwise rule with translating gliders; attractor topology; natural coarse-graining", obs: [field]}
  lenia:           {truth: "same as gray_scott, richer creatures; standard Lenia = pure pointwise reweighting", obs: [field]}
  flow_lenia:      {truth: "same growth field as Lenia but mass-conserving pure transport (Plantec et al. 2025) — ground-truth 'transport' extreme for cell 3", obs: [field]}
  ising:           {truth: "known RG flow direction and fixed point — calibration world for cell 10", obs: [spins]}
  kuramoto:        {truth: "torus; sync transition at known K_c", obs: [phases], held_out: true}
  damped_pendulum: {truth: "div = -2*gamma (uniform); asymmetric cost", obs: [angle]}
  friction_patch:  {truth: "divergence localized to patch", obs: [state]}
  lorenz:          {truth: "constant div = -(sigma+1+b)", obs: [state]}
  van_der_pol:     {truth: "state-dependent div = mu(1-x^2)", obs: [state]}
  mechanism_pair:  {truth: "known causal direction; independent mechanisms", obs: [x, y]}
  camera_ladder:   {truth: "same scene under Euclidean / affine / projective / homeomorphic observation maps", obs: [pixels64]}

cells:

  - id: 0
    name: 公共前提：潜空间能否承载几何结构
    structure: none
    slot: state_space
    source: intrinsic
    readout: diagnose
    learn: MLP 世界模型（对照组本身）
    fix: 无
    invariant: 潜空间的 H1 持续同调；能量是否可被平滑解码
    prediction: 中等尺寸下 H1 出现但跨种子不稳定；能量可解码但不平滑。
    kill_test: pendulum（角度 + 像素）；4 个尺寸 × 3 种子；持续同调 + 能量解码探针。若 H1 从不出现且能量不可平滑解码 → 格 1/4/9/15 先验下调，几何约束从可选变必需。
    cost_days: 1
    confidence: {exists: high, novel: low, yields: high}
    status: unexplored
    neighbors: [1, 4, 9, 15, 5]
    exits: []
    collision: n/a
    nearest: "Batson 2021 Topological Obstructions to Autoencoding（S^1 压到一维必出 break point）；Ivashkov 2026 Sensorimotor WM 在 Reacher 上自发观察到 flat 2-torus（涌现对照）；DySIB 2026 从单摆视频学出与相空间一致的二维表示"
    must: 判据定量化（H1 持续度阈值；能量解码平滑度指标）
    notes: 不是一个想法，是所有想法的地基。首凿。

  - id: 1
    name: 曲率即规律（测地线世界模型）
    structure: metric
    slot: state_space
    source: pullback_from_observation   # 审计后：度量必须钉在 p(o|z) 的 Fisher 拉回上，自由学 SPD 度量只作消融
    readout: predict
    learn: encoder/decoder 与动作偏离项；度量 = 观测模型的 Fisher 拉回（Arvanitidis 2022 工具）
    fix: 自由演化 = 测地线方程；度量来源固定
    invariant: 曲率场；"曲率图 = 障碍图"
    prediction: 含障碍的世界里，Fisher 拉回度量的截面曲率热图与真实障碍布局对齐（IoU / 相关显著高于零分布）；无阻尼单摆上 100 步 rollout 的能量漂移低于同参数 MLP；有阻尼时纯版本失败（失败本身是诊断）。
    kill_test: pendulum + PointMaze/带墙网格；对照 = 同参数 MLP 与 Temporal Straightening（JEPA + 拉直正则）；4 尺寸；曲率-障碍对齐 + 100 步 RMSE/能量漂移。曲率图与障碍无关、且任一尺寸不优于对照 → 死。
    cost_days: 3
    confidence: {exists: high, novel: lowmid, yields: mid}
    status: unexplored
    neighbors: [6, 15, 4, 9]
    exits: [physics_discovery_datasets, worldbench_param_estimation]
    collision: B+
    nearest: "Friedl et al. ICLR 2025 + 2026 续作（潜空间学 SPD 度量 + Euler–Lagrange + 外力，机器几乎同构）；Beik-Mohammadi/Klein/Xu（障碍=度量、运动=测地线，机器人运动生成）；Wang et al. 2026 Temporal Straightening（JEPA 里反向压平曲率）；Koide & van de Venn 2026（同一恢复力可归为曲率或非度量性 → 仅凭轨迹曲率与力不可辨识）；GeoWorld CVPR 2026 占名"
    must: 度量钉在 Fisher 拉回上以解决可辨识性；拿出"曲率图=障碍图"不变量；正面打败 Temporal Straightening；改名
    notes: 技术撞车最重；只有满足 must 才值得投入。合并候选 1+6（带挠率）。

  - id: 2
    name: 下降即规律（自然梯度流世界模型）
    structure: metric
    slot: distribution_over_states
    source: intrinsic
    readout: diagnose
    learn: 统计流形上的标量势 F；训练损失可取 de Alfaro 等的 natural deviation
    fix: Fisher 度量；动力学 = −G⁻¹∇F（+ 动作作为外加驱动）
    invariant: Fisher 度量下的 Hodge 分解：旋度 / 梯度比；natural deviation 的最优值 = "世界有多像一个 mirror-descent 学习者"
    prediction: 纯选择 replicator 世界旋度 ≈ 0 且恢复适应度景观（到单调变换）；RPS replicator 旋度占主导且梯度流 WM 误差高于 MLP（正确报出"不是下降世界"）；带突变的 replicator 落在两者之间且单调。
    kill_test: wright_fisher 三个变体（景观选择 / 带突变 / RPS）；拟合 F；Fisher 度量下 Hodge 分解（固定边界条件）；50 步误差。旋度比分不开三个世界 → 死。
    cost_days: 1
    confidence: {exists: high, novel: lowmid, yields: high}
    status: unexplored
    neighbors: [7, 5]
    exits: [physics_discovery_datasets]
    collision: B+
    nearest: "de Alfaro, Raab, Liu 2023 Conjugate Natural Selection（replicator = Bayes = Fisher 自然梯度流，定义 natural deviation）；Friston 2019 FEP f=(Q−Γ)∇ℑ（把下降+打转当公理）；JKOnet 系列（Wasserstein 度量下的同一模板）；HHD-GP NeurIPS 2024、Velde、ddHodge Nat Commun 2025（Hodge 诊断成熟）；Fujiwara 1993"
    must: 以可估计量立身（学到的 F + 旋度比 + natural deviation），写成"FEP 假设的分解，我们从数据估计并检验"；Hodge 分解要先固定度量与边界条件（可辨识性）
    notes: 叙事撞车重、技术空位清楚："Fisher 版 JKOnet"没人做。合并候选 2+5。

  - id: 3
    name: 搬运还是改权（Wasserstein–Fisher–Rao 世界模型）
    structure: metric
    slot: distribution_over_states
    source: intrinsic
    readout: diagnose
    learn: 速度场 v 与生长率 r：∂ₜp = −∇·(pv) + pr；比值做成 δ-谱 ratio(δ)（δ 从 0 = 纯 Fisher–Rao 扫到 ∞ = 纯 Wasserstein）
    fix: WFR 最小作用量决定 v/r 的分配（UPFI 证明不加 WFR 能量正则时 (v, r) 不可辨识，所以比值是"给定 δ 后的最小作用量选择"，不是过程的内在量——这正是把它做成 δ-谱的理由）
    invariant: 每个过程的搬运/改权比随 δ 的曲线；Flow-Lenia（纯搬运实现）与标准 Lenia（纯改权实现）是同一 growth 场的两个有真值的极端
    prediction: 同一 growth 场下，WFR 分解对 Flow-Lenia 给搬运占比 ≈ 1，对标准 Lenia 的 glider 给中间值，对静止振子给 ≈ 0；δ-谱曲线形状区分平移 / 生长 / 死亡 / 分裂四类过程，跨种子 CV < 20%。
    kill_test: 相邻帧之间算 WFR 测地线（Chizat 缩放算法或 WFR-FM）扫 δ；Lenia vs Flow-Lenia 同场对照；glider vs 振子。Flow-Lenia 不给 ≈1、或 δ-谱分不开四类过程 → 死。
    cost_days: 2
    confidence: {exists: high, novel: lowmid, yields: high}
    status: unexplored
    neighbors: [7, 10, 9]
    exits: [single_cell_trajectory_inference]
    collision: A/B
    nearest: "方法层 A：TIGON（Sha, Nat. Mach. Intell. 2024）→ DeepRUOT（Zhang, ICLR 2025 oral）→ VGFM 2025 → UPFI（Zhang et al. NeurIPS 2025，证明 (v, r) 不可辨识，需 WFR 能量正则）→ WFR-FM（Peng, ICLR 2026，几何、损失、输出与本格完全一致）→ WFR-MFM 2026 → USB 2026；Neklyudov Wasserstein Lagrangian Flows / Action Matching；urOMT（对图像序列做 WFR 拟合但不报比值）。试验场层 B：Flow-Lenia（Plantec, Artificial Life 2025：同一 growth 场的纯搬运解读，不提 OT）；MaCE 2025；Kojima & Ikegami（asymptotic Lenia 写成反应扩散 + glider 方程）；Gallouët 2017（反应扩散可拆成 W 步 + FR 步的数学依据）。Lenia + OT 零命中。"
    must: 不以"WFR 世界模型"为主张（方法已饱和，会被判增量）；主张只能是 (1) δ-谱指纹 (2) Lenia↔Flow-Lenia 有真值对照 (3) "完整密度曲线下的归因"而非快照推断
    notes: 方法层撞车最重的一格；但试验场完全空。合并候选 3+7（三种直线）；3+9+10 有理论桥（Cotler–Rezchikov：RG = OT 梯度流；Berman–Klinger：RG 尺度 = Fisher 可分辨性）。

  - id: 4
    name: 形状即规律（拓扑优先的世界模型）
    structure: topology
    slot: state_space
    source: intrinsic
    readout: predict
    learn: 先用持续同调从轨迹发现流形 M（Betti 数、连通分支），自动选潜流形，再学 M 上的流
    fix: 潜空间的拓扑
    invariant: Betti 数、连通分支；"拓扑错 → 撕裂指标（encoder Lipschitz 爆点、rollout 不连续计数）→ 误差"的因果链
    prediction: 严格固定参数量与潜维数时，拓扑匹配（S¹×R）的 WM 长程误差低于欧氏潜空间；强制错误拓扑比欧氏更差；拓扑由持续同调自动判定（Betti 数预测正确）。
    kill_test: pendulum 像素：潜空间 S¹×R vs R² vs R³（容量严格对齐）；4 尺寸；加错配测试；用 van Hulst 2026 的乘积拓扑先验或 flow 式 encoder 处理优化障碍。所有尺寸欧氏 ≥ 匹配 → 死。
    cost_days: 2
    confidence: {exists: high, novel: lowmid, yields: mid}
    status: unexplored
    neighbors: [1, 10, 11]
    exits: [known_topology_datasets_SO3_joint_spaces]
    collision: B+
    nearest: "GD-VAE（Lopez & Atzberger 2022/2025：预设 torus/Klein bottle 潜空间 + 动力学 + 拓扑错则撕裂；但拓扑是给定的，动力学半手工，表格里拓扑匹配不总赢）；Esmaeili 2023（几何潜空间的优化障碍：自交、错误 winding number）；Batson 2021；Stovold 2026 NCA 吸引子景观；Hudcová 2026 Lenia 参数空间分类（不用 TDA）"
    must: 做成"先发现再学"的闭环；容量严格固定（否则命题被 GD-VAE 式反例打掉）；把可训练性做成实验变量
    notes: Lenia 吸引子拓扑（不是形态拓扑）完全空。

  - id: 5
    name: 可分辨性即规律（模型流形世界模型）
    structure: metric
    slot: theory_space
    source: from_distinguishability
    readout: explain
    learn: 训练好的 WM 在 (state, action)→next-state 预测空间上的 FIM 谱；沿软方向压边界（MBAM）得有效理论
    fix: 数据分布
    invariant: 硬 / 软方向；硬方向是否架构无关；硬方向随预测时域的变化（TWIG 式）
    prediction: 两种架构学同一世界，预测空间里前 k 个硬方向的主角 < 30°（显著高于随机子空间），软方向不对齐；硬方向数 ≈ 世界真实规律数；且该对齐在"同一动力学、不同观测编码"下保持（排除"硬方向 = 数据协方差"）。
    kill_test: pendulum + toggle_grid；MLP vs 小 transformer/RSSM × 3 种子；1k 样本上用 Jacobian 算预测空间 FIM；主角 vs 随机子空间零分布；两组对照：Karakida 式随机初始化 baseline、Yang 式数据谱打乱 / 换观测编码。对齐不高于零分布，或换编码后对齐消失 → 死。
    cost_days: 3
    confidence: {exists: high, novel: mid, yields: low}
    status: unexplored
    neighbors: [2, 10, 0, 11]
    exits: []
    collision: B
    nearest: "Mao et al. PNAS 2024（多架构训练轨迹落在同一低维预测流形）；Yang, Mao, Chaudhari ICML 2022（FIM 谱镜像数据谱）；Karakida 2019（随机初始化已 sloppy）；Anderson & Transtrum 2023 TWIG（FIM 时窗谱读分岔结构，同时是格 11 的桥）；Transtrum 2016 / 2024 MBAM 扩展（没人用到学到的 NN 动力学上）；Chis 2014（sloppy ≠ 不可辨识）"
    must: 在预测空间而非参数空间比较（参数空间路线已被判定不可行）；实验必须能区分"规律"与"数据协方差"；MBAM 取边界极限而非 top-k 截断
    notes: 最大风险是替代解释，不是撞车。合并候选 2+5、5+11（TWIG）。

  - id: 6
    name: 联络即规律（联络 / 和乐世界模型）
    structure: connection
    slot: action_space
    source: intrinsic
    readout: diagnose
    learn: 每个动作一个平行移动映射 T_a(z)（仿射或小 flow）；沿环路复合；交换子范数 / 小环路和乐谱
    fix: 不要求度量；不要求动作可逆或成群（对照 WLA / Delliaux 的阿贝尔假设）
    invariant: 和乐 T_loop − I；非零 ⇒ 隐状态；曲率 = 隐状态的连续探测器
    prediction: toggle_grid 里经过开关的环路和乐显著非零、不经过的 ≈ 0（AUC > 0.9）；全可观测网格里所有环路 ≈ 0（AUC ≈ 0.5）；系统调隐状态位数时和乐谱单调响应；仅用被动日志时探测失效、加主动闭环探索后恢复（HCDP 的不可辨识性预言）。
    kill_test: 两个网格世界（有 / 无隐藏开关）+ HCDP 的 LoopGuess 类离散任务；训练平移 WM；随机环路算和乐；AUC；被动 vs 主动数据各跑一遍；对照 = 群结构 WM（Delliaux 2025）必然把和乐压成零。主动数据下仍分不开 → 死。
    cost_days: 1
    confidence: {exists: high, novel: midhigh, yields: mid}
    status: unexplored
    neighbors: [1, 12, 8]
    exits: [popgym, arc_agi_3_stretch]
    collision: B
    nearest: "Zhang et al. 2026-07 HCDP（离散置换群 holonomy ⇔ 需有序记忆的隐状态；被动数据不可辨识，需可重置的主动诊断）；Blattner 2025 Tangential Action Spaces（Ehresmann 联络曲率 = 路径依赖记忆，解析理论）；WLA 2025 / Delliaux 2025 / SMWM（明确假设可交换，非交换列为未做）；Dehdarirad 2026（Lie Group VAE 里交换子作可测量）；Wang & Wang NeurIPS-W 2025 小环路 holonomy 估计器；US Patent 12651010（prior art）"
    must: 把 HCDP 当离散极限的理论锚点引用，口号不再首创但方法空；主动闭环探索写进命题；可直接复用 Dehdarirad 的交换子协议与 Wang&Wang 的估计器
    notes: 五格里最空；不需要预测精度更高也能成立；中心性高，首批候选。

  - id: 7
    name: 两种直线 → α-计（对偶平坦世界模型）
    structure: order_dually_flat
    slot: distribution_over_states
    source: intrinsic
    readout: diagnose
    learn: 观测序列 encode 进指数族参数化的对偶平坦潜流形；每段轨迹估计"最直的 α-联络"（连续 α，不是硬分 e/m）；在对应平坦坐标里学线性转移
    fix: Amari 对偶平坦结构；记号固定（α=±1 哪个是 e/m 在文献里相反，写论文时显式声明）
    invariant: α(t)：e-直线段 = 世界在做选择 / 贝叶斯更新，m-直线段 = 世界在混合 / 扩散
    prediction: 迁移 / 选择交替的群体世界里，α 估计恢复相位标签准确率 > 90%，混合段落在中间；对的坐标里线性动力学优于错的坐标，小数据下优于 MLP；Gaussian 情形与 Koide & van de Venn 2026 的闭式 α 一致。
    kill_test: wright_fisher 合成相位（纯选择段、纯迁移段、混合段）；"e-平坦残差 vs m-平坦残差"随时间的曲线 + α 估计；再推广到 Gaussian 对照闭式。判别 ≈ 随机或无坐标优势 → 死。
    cost_days: 1
    confidence: {exists: high, novel: midhigh, yields: high}
    status: unexplored
    neighbors: [2, 3]
    exits: [physics_discovery_datasets]
    collision: B-
