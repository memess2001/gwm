      v0.4（2026-11-03）：
      (1) 思想实验：对角高斯后验的 FR 线元 ds² = Σ(dμ² + 2dσ²)/σ²。确定性世界里 σ 落到下限后基本不变，Fisher 弧长 = 固定加权的欧氏弧长，按本格自己的判据必死。所以单摆、Lorenz 不能用来测本格，Kuramoto 要加噪声。
      (2) 第二轮文献：等级 B 不变。新增近邻三条线：设计路径的信息时间调度（Stancevic 2025 熵时间、Goshtasbpour 2023 恒速率 AIS、Barzegar 2024）；事件时间世界模型（VPR ICLR 2022、THICK ICLR 2024、EAWM ICLR 2026，以及 Roseboom 2019 的累积欧氏表征变化时钟）；information rate 在真实数据上作诊断量（Nicholson & Kim 2016 音乐、Choong–Kim–He 2025 EEG）。
      (3) 更正：Zakharov 2020 是阈值化的惊奇时钟，不是信念变化时钟。
      (4) 对抗审稿（holds_with_caveats，脚本在 cells/9/exploratory/）修正了 (1)：σ 恒定时，Fisher 弧长退化为**白化**均值的欧氏弧长，不是原始潜空间欧氏弧长。
          σ̄ 各向异性时 Fisher 会假性胜出。确定性单摆上的高斯 RSSM：CV 比原始 μ 欧氏时钟低 0.031 [0.022, 0.041]，与冻结 σ 时钟只差 0.004（不显著）；用测地线逐步累积时假性胜出 0.060。
          所以真正的风险是"假性存活"，而不是"必死"。
          σ 是否变化取决于观测通道，而不是动力学是否确定：有噪或部分观测时 σ 会变，随机动力学加精确观测时后验仍是点质量。
          该 RSSM 的 σ ≈ 0.13，是 ELBO / free-nats 平衡的结果，并不贴在下限；"DreamerV3 min_std"的说法有误，DreamerV3 是类别潜变量，此时 Fisher 弧长恒等于 √p 欧氏弧长的 2 倍。
          世界的选择按观测通道定（Wright–Fisher counts、遮挡等），不只给动力学加噪声。
      v0.5（2026-11-04，handoff 作者）提议（回答 Q7）：
      世界用 Wright–Fisher 计数：二项噪声让 σ 随状态自然变化，白化欧氏弧长和 Fisher 弧长这时才分得开；单摆遮挡只作负对照。
      同源对照 = 冻结 σ 的白化欧氏弧长（rules.R2）。HANDOFF §7 第 4 条对 TOTR 的过度解读已在 HANDOFF v0.5 更正。
