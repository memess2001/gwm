      精确 WF 路径（选择、迁移、两者混合；随机起点与稀有入侵者；事件 = 最终胜者首次超过 0.5 或 0.9）上，事件时刻跨种子的 CV：
      墙钟 0.83–2.40，各种弧长 0.46–1.32。任何弧长都远比墙钟规整，这是去掉速度的重参数化效果（TOTR 的地盘）。
      在几种弧长之间，Fisher（Shahshahani）只在 8 个情形里赢 1 个（差 0.014），欧氏赢 5 个，logit（clr）赢 2 个，没有偏向 Fisher 的机制。
      所以第一条预测（事件在 τ 里更规整）在"胜过欧氏弧长"这一步大概率不成立；按 R1，这类精确状态上的结果能削弱、不能救。
      第二条（在 τ 里训练、换回墙钟评估的 k 步误差）是真正的约束型问题，思想实验判不了，但目前看不出它为什么偏向 Fisher：选择主导时 logit 弧长让时钟速率恒定，迁移主导时欧氏更好。
      补（2026-11-17 JST，外部评估会话）：上面的检查用到 600 步的确定性 mixed 路径，当时 zoo 的 RK4 在长视界上有单纯形漂移（results/ledger.md "动物园修复记录"）。修复后重跑，只有 mixed 两行在第三位小数上变化，最优时钟不变，结论不变（cells/9/exploratory/c9_clock_metric_after_simplex_fix.out）。

